# Serves the Angular app and forwards API calls to the FastAPI backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 250m;

  # /api/documents -> http://api:8000/documents
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream big uploads straight through
    proxy_read_timeout 300s;       # long answers / large uploads
  }

  # Swagger UI of the backend on the same address as the app.
  location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # Hashed build files can be cached forever; index.html never.
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
